app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN0dWRlbnRNYW5hZ2VtZW50QXBwU2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnRPbmx5MTIzNDU2Nzg=}
app.jwt.expiration-ms=86400000
